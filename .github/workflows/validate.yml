name: Validate changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/requirements-sync.txt
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.1"
          extended: true
      - name: Import, test and build
        run: |
          bash scripts/import_data.sh
          python -m unittest discover -s tools -p 'test_*.py'
          bash scripts/build.sh
          git diff --check
          git diff --exit-code -- frontend/data frontend/content
