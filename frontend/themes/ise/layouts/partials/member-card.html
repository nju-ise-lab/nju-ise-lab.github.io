<article class="member-card">
  {{ if eq .name "xxx" }}
    <div class="member-card__avatar member-card__avatar--placeholder" aria-hidden="true">
      <span>×</span>
    </div>
  {{ else }}
  <a class="member-card__avatar" href="{{ .url }}" aria-label="{{ .name }}">
    {{ with .avatar_url }}
      <img src="{{ . }}" alt="{{ $.name }}">
    {{ else }}
      <span>{{ substr .name 0 1 }}</span>
    {{ end }}
  </a>
  {{ end }}
  <h3>{{ if eq .name "xxx" }}<span>{{ .name }}</span>{{ else }}<a href="{{ .url }}">{{ .name }}</a>{{ end }}</h3>
  {{ with .identity }}<p class="member-card__role">{{ . }}</p>{{ end }}
</article>
