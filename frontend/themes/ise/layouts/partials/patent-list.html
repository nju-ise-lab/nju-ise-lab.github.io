{{ $patents := default (slice) .patents }}
<ul class="section-list project-list patent-list">
  {{ range $patents }}
    <li>
      <strong>{{ .patent_name }}</strong>
      {{ $inventors := .inventors }}
      {{ if $inventors }}
        <p class="project-list__authors">{{ partial "author-list.html" $inventors }}</p>
      {{ end }}
    </li>
  {{ else }}
    <li class="empty-item">暂无关联专利。</li>
  {{ end }}
</ul>
