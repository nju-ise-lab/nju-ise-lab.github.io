{{ with .Params.image }}
  {{ if hasPrefix . "/" }}
    <figure class="article__image">
      <img src="{{ . }}" alt="{{ $.Title }}" loading="lazy">
    </figure>
  {{ else }}
    {{ with $.Resources.GetMatch . }}
      <figure class="article__image">
        <img src="{{ .RelPermalink }}" alt="{{ $.Title }}" loading="lazy">
      </figure>
    {{ end }}
  {{ end }}
{{ end }}
