{{ define "main" }}
  {{ partial "breadcrumb.html" . }}
  <div class="page-shell container">
    <section class="page-main projects-page" data-projects-page>
      {{ $catalog := index hugo.Data "project-records" }}
      {{ $projects := slice }}
      {{ with $catalog }}{{ with .projects }}{{ $projects = . }}{{ end }}{{ end }}
      {{ partial "project-list.html" (dict "records" $projects) }}
    </section>
  </div>
{{ end }}
